<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tool Stack</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080a0f;
    --bg2: #0d1017;
    --surface: #111520;
    --border: rgba(255,255,255,0.07);
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --accent3: #f472b6;
    --text: #e2e8f0;
    --muted: #64748b;
    --card-glow: rgba(110,231,183,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── noise overlay ─── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: .6;
  }

  /* ─── hero header ─── */
  .hero {
    position: relative;
    padding: 120px 40px 80px;
    text-align: center;
    overflow: hidden;
  }

  .hero-glow {
    position: absolute;
    width: 800px; height: 500px;
    background: radial-gradient(ellipse, rgba(110,231,183,0.12) 0%, rgba(129,140,248,0.08) 40%, transparent 70%);
    left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    animation: pulseGlow 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulseGlow {
    0%,100% { opacity: .6; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
  }

  .hero-label {
    font-family: 'Stage Grotesk', sans-serif; letter-spacing: 0.03em;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp .6s .2s forwards;
  }

  .hero h1 {
    font-size: clamp(52px, 10vw, 100px);
    font-weight: 800;
    line-height: .95;
    letter-spacing: -3px;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 60%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    animation: fadeUp .7s .35s forwards;
  }

  .hero-sub {
    margin-top: 20px;
    font-family: 'Stage Grotesk', sans-serif; letter-spacing: 0.03em;
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    opacity: 0;
    animation: fadeUp .7s .5s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── divider line ─── */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border) 20%, var(--accent) 50%, var(--border) 80%, transparent);
    margin: 0 auto 80px;
  }

  /* ─── section titles ─── */
  .section-label {
    font-family: 'Stage Grotesk', sans-serif; letter-spacing: 0.03em;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 48px;
    position: relative;
  }
  .section-label span {
    background: var(--bg);
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }
  .section-label::before {
    content: '';
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 1px;
    background-color: var(--border);
  }

  /* ─── grid ─── */
  .grid-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 40px 100px;
  }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  /* ─── card ─── */
  .tool-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 20px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    cursor: default;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), border-color .3s, box-shadow .3s;
    opacity: 0;
    transform: translateY(30px);
    overflow: hidden;
  }

  .tool-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .tool-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--card-glow);
    opacity: 0;
    transition: opacity .3s;
    border-radius: inherit;
  }

  .tool-card:hover {
    transform: translateY(-6px) scale(1.03);
    border-color: rgba(110,231,183,0.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(110,231,183,0.1);
  }

  .tool-card:hover::before { opacity: 1; }

  .tool-card:hover .tool-icon img,
  .tool-card:hover .tool-icon svg {
    transform: scale(1.1) rotate(-3deg);
  }

  /* ─── icon wrapper ─── */
  .tool-icon {
    width: 60px; height: 60px;
    background: rgba(255,255,255,0.04);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    transition: box-shadow .3s;
  }

  .tool-card:hover .tool-icon {
    box-shadow: 0 0 20px rgba(110,231,183,0.2);
  }

  .tool-icon img {
    width: 38px; height: 38px;
    object-fit: contain;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }

  .tool-icon svg {
    width: 38px; height: 38px;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }

  .tool-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .3px;
    text-align: center;
    color: var(--text);
    line-height: 1.2;
  }

  .tool-tag {
    font-family: 'Stage Grotesk', sans-serif; letter-spacing: 0.03em;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  /* ─── category badge ─── */
  .cat-dot {
    position: absolute;
    top: 12px; right: 12px;
    width: 7px; height: 7px;
    border-radius: 50%;
  }

  /* ─── marquee strip ─── */
  .marquee-section { background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 256 256\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noise\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noise)\' opacity=\'0.04\'/%3E%3C/svg%3E');
    padding: 40px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    margin: 0 0 80px;
    position: relative;
  }

  .marquee-track {
    display: flex;
    gap: 60px;
    white-space: nowrap;
    animation: marquee 28s linear infinite;
  }

  .marquee-section:hover .marquee-track {
    animation-play-state: paused;
  }

  .marquee-item {
    font-family: 'Stage Grotesk', sans-serif; letter-spacing: 0.03em;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .marquee-item span.dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ─── footer ─── */
  .footer {
    text-align: center;
    padding: 60px 40px;
    border-top: 1px solid var(--border);
    font-family: 'Stage Grotesk', sans-serif; letter-spacing: 0.03em;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .footer em { color: var(--accent); font-style: normal; }

  /* ─── scrollbar ─── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

  /* ─── stagger delays ─── */
  .tool-card:nth-child(1)  { transition-delay: 0.00s; }
  .tool-card:nth-child(2)  { transition-delay: 0.04s; }
  .tool-card:nth-child(3)  { transition-delay: 0.08s; }
  .tool-card:nth-child(4)  { transition-delay: 0.12s; }
  .tool-card:nth-child(5)  { transition-delay: 0.16s; }
  .tool-card:nth-child(6)  { transition-delay: 0.20s; }
  .tool-card:nth-child(7)  { transition-delay: 0.24s; }
  .tool-card:nth-child(8)  { transition-delay: 0.28s; }
  .tool-card:nth-child(9)  { transition-delay: 0.32s; }
  .tool-card:nth-child(10) { transition-delay: 0.36s; }
  .tool-card:nth-child(11) { transition-delay: 0.40s; }
  .tool-card:nth-child(12) { transition-delay: 0.44s; }
  .tool-card:nth-child(13) { transition-delay: 0.48s; }
  .tool-card:nth-child(14) { transition-delay: 0.52s; }
  .tool-card:nth-child(15) { transition-delay: 0.56s; }
  .tool-card:nth-child(16) { transition-delay: 0.60s; }
  .tool-card:nth-child(17) { transition-delay: 0.64s; }
  .tool-card:nth-child(18) { transition-delay: 0.68s; }

  /* card transition override for animation */
  .tool-card {
    transition:
      opacity .5s ease,
      transform .5s cubic-bezier(.34,1.56,.64,1),
      border-color .3s,
      box-shadow .3s;
  }

  .tool-card.visible:hover {
    transform: translateY(-6px) scale(1.03) !important;
  }
</style>
</head>
<body>

<!-- ── Hero ── -->
<header class="hero">
  <div class="hero-glow"></div>
  <p class="hero-label">✦ Design · Build · Ship · Repeat</p>
  <h1>My Tool Stack</h1>
  <p class="hero-sub">// the exact tools powering every project</p>
</header>

<div class="divider"></div>

<!-- ── Marquee ── -->
<div class="marquee-section">
  <div class="marquee-track" id="marquee">
    <!-- filled by JS -->
  </div>
</div>

<!-- ── Grid ── -->
<div class="grid-wrapper">

  <p class="section-label"><span>Design & Prototyping</span></p>
  <div class="tools-grid" id="grid-design"></div>

  <br><br>
  <p class="section-label" style="margin-top:40px"><span>Build & Deploy</span></p>
  <div class="tools-grid" id="grid-build"></div>

  <br><br>
  <p class="section-label" style="margin-top:40px"><span>AI & No-Code</span></p>
  <div class="tools-grid" id="grid-ai"></div>

</div>

<!-- ── Footer ── -->
<footer class="footer">
  Crafted with ♥ &nbsp;·&nbsp; <em>My Tool Stack</em> &nbsp;·&nbsp; Always Evolving
</footer>

<script>
// ─── Tool data ──────────────────────────────────────────────────
const tools = {
  design: [
    {
      name: 'Figma',
      tag: 'Design',
      color: '#1ABCFE',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/figma.svg" style="filter:invert(1)" alt="Figma">`
    },
    {
      name: 'FigJam',
      tag: 'Whiteboard',
      color: '#F24E1E',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/figma.svg" style="filter:invert(1) sepia(1) saturate(5) hue-rotate(-10deg)" alt="FigJam">`
    },
    {
      name: 'Canva',
      tag: 'Graphics',
      color: '#00C4CC',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/canva.svg" style="filter:invert(1)" alt="Canva">`
    },
    {
      name: 'Framer',
      tag: 'Prototyping',
      color: '#0055FF',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/framer.svg" style="filter:invert(1)" alt="Framer">`
    },
    {
      name: 'Whimsical',
      tag: 'Diagrams',
      color: '#7C5CFC',
      icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#7C5CFC" opacity=".15"/>
        <path d="M14 24 Q19 14 24 24 Q29 34 34 24" stroke="#7C5CFC" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="14" cy="24" r="3" fill="#7C5CFC"/>
        <circle cx="34" cy="24" r="3" fill="#7C5CFC"/>
      </svg>`
    },
    {
      name: 'Napkin',
      tag: 'Visuals',
      color: '#F59E0B',
      icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#F59E0B" opacity=".15"/>
        <path d="M16 32 L20 18 L24 26 L28 20 L32 32" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="24" cy="14" r="4" fill="#F59E0B" opacity=".7"/>
      </svg>`
    },
    {
      name: 'Figma Make',
      tag: 'AI Design',
      color: '#A259FF',
      icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#A259FF" opacity=".15"/>
        <circle cx="18" cy="18" r="6" fill="#1ABCFE" opacity=".8"/>
        <circle cx="30" cy="18" r="6" fill="#A259FF" opacity=".8"/>
        <circle cx="18" cy="30" r="6" fill="#F24E1E" opacity=".8"/>
        <circle cx="30" cy="30" r="6" fill="#0ACF83" opacity=".8"/>
        <path d="M22 22 L26 26" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>`
    },
  ],
  build: [
    {
      name: 'Cursor',
      tag: 'AI Editor',
      color: '#6EE7B7',
      icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#6EE7B7" opacity=".1"/>
        <path d="M24 10 L38 34 L24 28 L10 34 Z" fill="#6EE7B7" opacity=".9"/>
        <path d="M24 10 L38 34 L24 28 Z" fill="white" opacity=".2"/>
      </svg>`
    },
    {
      name: 'GitHub',
      tag: 'Version Control',
      color: '#ffffff',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" style="filter:invert(1)" alt="GitHub">`
    },
    {
      name: 'Vercel',
      tag: 'Deployment',
      color: '#ffffff',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/vercel.svg" style="filter:invert(1)" alt="Vercel">`
    },
    {
      name: 'Netlify',
      tag: 'Deployment',
      color: '#00C7B7',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/netlify.svg" style="filter:invert(1)" alt="Netlify">`
    },
    {
      name: 'Supabase',
      tag: 'Database',
      color: '#3ECF8E',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/supabase.svg" style="filter:invert(1)" alt="Supabase">`
    },
    {
      name: 'Replit',
      tag: 'Cloud IDE',
      color: '#F26207',
      icon: `<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/replit.svg" style="filter:invert(1)" alt="Replit">`
    },
  ],
  ai: [
    {
      name: 'Antigravity',
      tag: 'AI Tools',
      color: '#818CF8',
      icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#818CF8" opacity=".12"/>
        <circle cx="24" cy="24" r="10" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 3"/>
        <circle cx="24" cy="12" r="3" fill="#818CF8"/>
        <path d="M24 15 L24 21" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 22 L24 18 L28 22" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>`
    },
    {
      name: 'Emergent',
      tag: 'AI Build',
      color: '#F472B6',
      icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#F472B6" opacity=".1"/>
        <path d="M24 10 L26 20 L36 18 L28 26 L34 36 L24 30 L14 36 L20 26 L12 18 L22 20 Z" fill="#F472B6" opacity=".8"/>
      </svg>`
    },
    {
      name: 'AI Studio',
      tag: 'Google AI',
      color: '#4285F4',
      icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#4285F4" opacity=".1"/>
        <path d="M24 10 C17.4 10 12 15.4 12 22 C12 28.6 17.4 34 24 34 C30.6 34 36 28.6 36 22" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="24" cy="22" r="5" fill="#4285F4" opacity=".7"/>
        <path d="M32 16 L38 10 M36 10 L38 10 L38 16" stroke="#34A853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`
    },
    {
      name: 'Lovable',
      tag: 'AI Builder',
      color: '#FF6B6B',
      icon: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#FF6B6B" opacity=".1"/>
        <path d="M24 36 C24 36 10 28 10 19 C10 14.6 13.6 11 18 11 C20.5 11 22.8 12.2 24 14 C25.2 12.2 27.5 11 30 11 C34.4 11 38 14.6 38 19 C38 28 24 36 24 36Z" fill="#FF6B6B" opacity=".8"/>
      </svg>`
    },
  ]
};

// ─── Marquee fill ────────────────────────────────────────────────
const allNames = [
  ...tools.design.map(t=>t.name),
  ...tools.build.map(t=>t.name),
  ...tools.ai.map(t=>t.name)
];
const doubled = [...allNames, ...allNames];
const marquee = document.getElementById('marquee');
doubled.forEach(name => {
  const item = document.createElement('div');
  item.className = 'marquee-item';
  item.innerHTML = `<span class="dot"></span>${name}`;
  marquee.appendChild(item);
});

// ─── Card builder ────────────────────────────────────────────────
function buildCards(containerId, list) {
  const grid = document.getElementById(containerId);
  list.forEach(tool => {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.innerHTML = `
      <div class="cat-dot" style="background:${tool.color}22;border:1.5px solid ${tool.color}55"></div>
      <div class="tool-icon" style="border:1px solid ${tool.color}33">
        ${tool.icon}
      </div>
      <div>
        <div class="tool-name">${tool.name}</div>
        <div class="tool-tag">${tool.tag}</div>
      </div>
    `;
    // override card glow per-tool
    card.style.setProperty('--card-glow', `${tool.color}08`);
    grid.appendChild(card);
  });
}

buildCards('grid-design', tools.design);
buildCards('grid-build', tools.build);
buildCards('grid-ai', tools.ai);

// ─── Scroll-triggered reveal ─────────────────────────────────────
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      observer.unobserve(e.target);
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll('.tool-card').forEach(card => observer.observe(card));

// ─── Cursor sparkle ──────────────────────────────────────────────
document.addEventListener('mousemove', e => {
  if (Math.random() > 0.92) {
    const spark = document.createElement('div');
    Object.assign(spark.style, {
      position: 'fixed',
      left: e.clientX + 'px',
      top: e.clientY + 'px',
      width: '4px',
      height: '4px',
      borderRadius: '50%',
      background: Math.random() > .5 ? '#6ee7b7' : '#818cf8',
      pointerEvents: 'none',
      zIndex: 9999,
      transform: 'translate(-50%,-50%)',
      transition: 'opacity .8s, transform .8s',
      opacity: '1'
    });
    document.body.appendChild(spark);
    requestAnimationFrame(() => {
      spark.style.opacity = '0';
      spark.style.transform = `translate(${(Math.random()-.5)*40}px, ${-30 - Math.random()*20}px)`;
    });
    setTimeout(() => spark.remove(), 900);
  }
});
</script>
</body>
</html>
